name: yoga_studio_app
description: "A premium Yoga Studio Management & Booking mobile application."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management & Routing
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0

  # Firebase Suite
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0
  cloud_firestore: ^5.0.1
  firebase_storage: ^12.0.1
  cloud_functions: ^5.1.0
  firebase_messaging: ^15.1.0

  # Native & Browser Launchers
  url_launcher: ^6.3.0

  # Video Conferencing
  jitsi_meet_flutter_sdk: ^13.3.0

  # UI, Fonts & Formatting
  google_fonts: ^6.2.1
  intl: ^0.19.0
  uuid: ^4.4.0
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

